<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1E4CF; display: flex; flex-direction: column; padding: 96px 28px 64px 28px; font-family: 'Inter', system-ui, sans-serif; color: #141413">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; color: #141413; font-style: italic">Hello Anna</h1>
<div style="flex: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; box-sizing: border-box; border-radius: 48px; background: #FAF6EC; border: 1px solid rgba(20,20,19,0.10); box-shadow: 0 1px 2px rgba(20,20,19,0.04), 0 12px 32px rgba(120,84,40,0.10); padding: 28px; display: flex; flex-direction: column">
<button onClick="{{toggle}}" aria-expanded="{{open}}" style="min-height: 112px; background: transparent; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0; cursor: pointer; color: #141413">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #BF5B3A; display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease; transform: rotate({{iconRotate}})">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>
</span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; color: #141413; font-weight: 700">Create your first habit?</span>
</button>
<div style="overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease, visibility 0.4s; max-height: {{listMaxH}}; opacity: {{listOpacity}}; visibility: {{listVis}}">
<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 22px">
<a href="Fitness.dc.html" style="display: flex; align-items: center; gap: 14px; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 28px; background: #DCE0EE; text-decoration: none; color: #1B1D2E">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #4A52A6"></span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 700">Fitness</span>
<svg style="margin-left: auto" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#1B1D2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5-5 5"></path></svg>
</a>
<a href="Expenses.dc.html" style="display: flex; align-items: center; gap: 14px; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 28px; background: #DDE5D3; text-decoration: none; color: #1F2A22">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #2F5D46"></span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 700">Expenses</span>
<svg style="margin-left: auto" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#1F2A22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5-5 5"></path></svg>
</a>
<a href="Hobbies.dc.html" style="display: flex; align-items: center; gap: 14px; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 28px; background: #F2D9A8; text-decoration: none; color: #2B2111">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #9A6412"></span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 700">Hobbies</span>
<svg style="margin-left: auto" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2B2111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5-5 5"></path></svg>
</a>
<a href="Health.dc.html" style="display: flex; align-items: center; gap: 14px; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 28px; background: #F3D9D6; text-decoration: none; color: #2A1514">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #A8353A"></span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 700">Health</span>
<svg style="margin-left: auto" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2A1514" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5-5 5"></path></svg>
</a>
<a href="More.dc.html" style="display: flex; align-items: center; gap: 14px; height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(20,20,19,0.12); text-decoration: none; color: #141413">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #141413"></span>
<span style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 700">More?</span>
<svg style="margin-left: auto" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#141413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 5-5 5"></path></svg>
</a>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOpen":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const open = this.state && this.state.open !== undefined ? !!this.state.open : !!(this.props.startOpen ?? true);
return {
open: open,
toggle: () => this.setState({ open: !open }),
iconRotate: open ? '45deg' : '0deg',
listMaxH: open ? '420px' : '0px',
listOpacity: open ? '1' : '0',
listVis: open ? 'visible' : 'hidden'
};
}
}
</script>
</body>
</html>
