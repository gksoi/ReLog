function createHomeNavigation(root,options) {   const nav=root.querySelector('.domain-nav'),home=root.querySelector('.home-view'),stack=root.querySelector('.tracker-stack');   let index=0,touch=null,swiped=false,lockedUntil=0,frame;   nav.innerHTML=domains.map(domain=>'<button type="button" data-domain="'+domain.id+'" aria-pressed="'+(domain.id==='all')+'" aria-controls="tracker-list">'+domain.name+'</button>').join('');   function select(id,focus=false,jump=true) {     const next=domains.findIndex(domain=>domain.id===id);if(next<0)throw Error('Unknown domain');     const direction=next-index,previous=root.dataset.domain;index=next;root.dataset.domain=id;     for(const button of nav.children)button.setAttribute('aria-pressed',String(button.dataset.domain===id));     if(direction||previous!==id)options.onChange(id,jump);     const selected=nav.querySelector('[data-domain="'+id+'"]');     nav.scrollTo({left:Math.max(0,selected.offsetLeft-nav.offsetLeft-nav.clientWidth/2+selected.clientWidth/2),behavior:'instant'});     if(focus)selected.focus();     if(jump){lockedUntil=Date.now()+650;const destination=id==='all'?nav:stack.querySelector('[data-domain-section="'+id+'"]');destination.scrollIntoView({block:'start',behavior:root.dataset.embedded==='true'||root.classList.contains('reduced-motion')||matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}     if(jump&&direction&&!root.classList.contains('reduced-motion')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)stack.animate([{opacity:.5,transform:'translateX('+(direction>0?18:-18)+'px)'},{opacity:1,transform:'translateX(0)'}],{duration:240,easing:'cubic-bezier(.22,1,.36,1)'});   }   nav.addEventListener('click',event=>{const button=event.target.closest('[data-domain]');if(button)select(button.dataset.domain);});   nav.addEventListener('keydown',event=>{     if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;     event.preventDefault();const next=event.key==='Home'?0: function renderCalendar(events,period,anchor,selectedDate) {   const dates=calendarDates(period,anchor),rows=scheduleInRange(events,period,anchor);   const month=new Date(anchor+'T12:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});   const label=period===3?month:dateLabel(dates[0])+(dates.length>1?' – '+dateLabel(dates.at(-1)):'')+' · '+anchor.slice(0,4);   function agenda(days) {     return days.map(date=>{       const items=rows.filter(event=>event.date===date);       return '<section class="agenda-day"><h3>'+dateLabel(date)+(date===DEMO_TODAY?' · Today':'')+'</h3>'+(items.length?items.map(event=>'<button type="button" class="scheduled-event '+event.domain+'" data-event="'+event.id+'"><span class="event-time">'+event.start+'–'+event.end+'</span><strong>'+escapeHtml(event.title)+'</strong><span class="event-domain">'+domains.find(domain=>domain.id===event.domain).name+'</span></button>').join(''):'<p class="calendar-empty">Nothing scheduled.</p>')+'</section>';     }).join('');   }   let content;   if(period===3){     const offset=(new Date(dates[0]+'T12:00:00Z').getUTCDay()+6)%7;     content='<div class="month-weekdays" aria-hidden="true">'+['M','T','W','T','F','S','S'].map(day=>'<span>'+day+'</span>').join('')+'</div><div class="month-grid" aria-label="'+month+'">'+'<span class="month-blank" aria-hidden="true"></span>'.repeat(offset)+dates.map(date=>{       const items=rows.filter(event=>event.date===date),categories=[...new Set(items.map(event=>event.domain))];       return '<button type="button" data-calendar-date="'+date+'" aria-pressed="'+(date===selectedDate)+'" '+(date===DEMO_TODAY?'aria-current="date" ':'')+'aria-label="'+dateLabel(date)+', '+items.length+' scheduled '+(items.length===1?'event':'events')+(categories.length?', '+categories.map(id=>domains.find(domain=>domain.id===id).name).join(', '):'')+'"><span>'+Number(date.slice(8))+'</span><span class="day-marks" aria-hidden="true">'+categories.map(id=>'<i class="'+id+'"></i>').join('')+'</span></button>';     }).join('')+'</div><div class="calendar-legend">'+domains.filter(domain=>domain.id!=='all').map(domain=>'<span class="'+domain.id+'">'+domain.name+'</span>').join('')+'</div>'+agenda([selectedDate]);   }else content=agenda(dates);   return '<div class="calendar-top"><button type="button" class="calendar-back" aria-label="Back to trackers">‹</button><span>Demo schedule</span></div><h1 class="calendar-title">Calendar</h1><div class="calendar-periods" aria-label="Calendar period">'+calendarPeriods.map((name,index)=>'<button type="button" data-calendar-period="'+index+'" aria-pressed="'+(index===period)+'">'+name+'</button>').join('')+'</div><div class="calendar-range"><button type="button" data-calendar-shift="-1" aria-label="Previous period">‹</button><h2>'+label+'</h2><button type="button" data-calendar-shift="1" aria-label="Next period">›</button></div><div class="calendar-tools"><button type="button" data-calendar-today>Today</button><button type="button" class="schedule-add">Schedule event +</button></div><div class="calendar-content" aria-live="polite">'+content+'</div>'; }

function createCalendarPage(root,options) {   const home=root.querySelector('.home-view'),page=root.querySelector('.calendar-page'),embedded=root.dataset.embedded==='true';   let period=0,anchor=DEMO_TODAY,selectedDate=DEMO_TODAY,next=0;   const editor=createCalendarEditor(root,{     getTrackers:options.getTrackers,getDomain:options.getDomain,nextId:()=> 'schedule-'+(++next),     onSave:record=>{options.onSave(record);anchor=record.date;selectedDate=record.date;render();options.notify('Event saved');},     onDelete:id=>{options.onDelete(id);render();options.notify('Event removed');}   });   function render() {page.innerHTML=renderCalendar(options.getEvents(),period,anchor,selectedDate);}   function open(push=true) {     options.onOpen();period=options.getPeriod();anchor=DEMO_TODAY;selectedDate=DEMO_TODAY;     home.hidden=true;root.querySelector('.tracker-page').hidden=true;root.querySelector('.context-page').hidden=true;delete root.dataset.page;     root.dataset.calendar='true';page.hidden=false;render();     if(push&&!embedded)history.pushState({},'','#calendar');     page.querySelector('.calendar-back').focus();root.scrollIntoView({block:'start',behavior:'instant'});     if(!root.classList.contains('reduced-motion')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)page.animate([{transform:'translateY(48px)',opacity:.4},{transform:'translateY(0)',opacity:1}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'});   }   function close(push=true) {     page.hidden=true;delete root.dataset.calendar;home.hidden=false;options.onClose();     if(push&&!embedded)history.pushState({},'',location.pathname+location.search);     root.querySelector('.calendar-open').focus();   }   function shift(direction) {     if(period===3){const date=new Date(anchor+'T12:00:00Z');date.setUTCDate(1);date.setUTCMonth(date.getUTCMonth()+direction);anchor=date.toISOString().slice(0,10);}     else anchor=offsetDate(anchor,direction*[1,3,7][period]);     selectedDate=calendarDates(period,anchor)[0];render();page.querySelector('[data-calendar-shift="'+direction+'"]').focus();   }   page.addEventListener('click',event=>{     const button=event.target.closest('button');if(!button)return;     if(button.classList.contains('calendar-back'))close();     else if(button.hasAttribute('data-calendar-period')){period=Number(button.dataset.calendarPeriod);options.onPeriod(period);if(!calendarDates(period,anchor).includes(selectedDate))selectedDate=anchor;render();page.querySelector('[data-calendar-period="'+period+'"]').focus();}     else if(button.hasAttribute('data-calendar-shift'))shift(Number(button.dataset.calendarShift));     else if(button.hasAttribute('data-calendar-today')){anchor=DEMO_TODAY;selectedDate=DEMO_TODAY;render();page.querySelector('[data-calendar-today]').focus();}     else if(button.hasAttribute('data-calendar-date')){selectedDate=button.dataset.calendarDate;render();page.querySelector('[data-calendar-date="'+selectedDate+'"]').focus();}     else if(button.classList.contains('schedule-add'))editor.open(null,selectedDate);     else if(button.hasAttribute('data-event'))editor.open(options.getEvents().find(item=>item.id===button.dataset.event),selectedDate);   });   if(!embedded)window.addEventListener('popstate',()=>{if(location.hash==='#calendar')open(false);else{page.hidden=true;delete root.dataset.calendar;}});   return {open,restore:()=>{if(!embedded&&location.hash==='#calendar')open(false);}}; } 
function initCalendarGesture(root,open) {   const home=root.querySelector('.home-view'),gate=root.querySelector('.calendar-gate'),peek=root.querySelector('.calendar-peek');   let armed=false,gesture=null,wheel=null,timer;   const available=()=>!home.hidden&&!root.querySelector('.tracker-stack').hidden&&!root.querySelector('dialog[open]');   const atBottom=()=>gate.getBoundingClientRect().bottom<=window.innerHeight+3;   const show=distance=>{gate.classList.toggle('pulling',distance>0);peek.style.height=Math.min(110,Math.max(0,distance*.6))+'px';gate.dataset.pull=pullAction(distance);};   function finish(distance) {show(0);if(pullAction(distance)==='open'){armed=false;open();}}   home.addEventListener('touchstart',event=>{     if(!available()||event.touches.length!==1||event.target.closest('input,select,textarea,.domain-nav')){gesture=null;return;}     const point=event.touches[0];gesture={x:point.clientX,y:point.clientY,eligible:armed&&atBottom(),distance:0};   },{passive:true});   home.addEventListener('touchmove',event=>{     if(!gesture?.eligible||event.touches.length!==1)return;     const point=event.touches[0],dy=gesture.y-point.clientY,dx=point.clientX-gesture.x;     if(dy<=0||Math.abs(dx)>dy)return;     event.preventDefault();gesture.distance=dy;show(dy);   },{passive:false});   home.addEventListener('touchend',()=>{     if(!gesture)return;const current=gesture;gesture=null;     if(current.eligible)finish(current.distance);else{show(0);if(available()&&atBottom())armed=true;}   },{passive:true});   home.addEventListener('touchcancel',()=>{gesture=null;show(0);});   home.addEventListener('wheel',event=>{     if(!available()||event.ctrlKey||Math.abs(event.deltaX)>Math.abs(event.deltaY))return;     if(!wheel)wheel={eligible:armed&&atBottom(),distance:0};     if(wheel.eligible&&event.deltaY>0){event.preventDefault();wheel.distance+=event.deltaY*(event.deltaMode===1?16:1);show(wheel.distance*.6);}     clearTimeout(timer);timer=setTimeout(()=>{const current=wheel;wheel=null;if(current.eligible)finish(current.distance*.6);else if(atBottom())armed=true;},180);   },{passive:false});   root.addEventListener('domainchange',()=>{armed=false;gesture=null;wheel=null;clearTimeout(timer);show(0);});   gate.querySelector('button').addEventListener('click',()=>{show(0);open();});   return {reset:()=>{armed=false;gesture=null;show(0);}}; } 
const root=document.getElementById('relog-motion'); const $=selector=>root.querySelector(selector); const state={period:0,domain:'all',first:false,records:createDemoHistory().concat(createDomainHistory()),custom:[],notes:[],schedule:createDemoSchedule()}; const stack=$('.tracker-stack'),dock=$('.dock'),dialog=$('dialog'),form=dialog.querySelector('form'); let active=null,action=null,toastTimer; const allTrackers=()=>trackers.concat(domainTrackers,state.custom); function toast(message){$('.toast').textContent=message;$('.toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.toast').classList.remove('visible'),2400);} initProfile(root,toast); const pages=createTrackerPages(root,{getRecords:()=>state.records,getContexts:()=>state.notes,getTrackers:allTrackers,onEntry:tracker=>tracker.id.startsWith('habit-')?completeSession(tracker):entry(tracker),onEnergy:tracker=>entry(tracker,'energy')}); function renderHome(){   stack.innerHTML=domains.filter(domain=>domain.id!=='all').map(domain=>{     const members=trackersForDomain(allTrackers(),domain.id);     return '<section class="domain-section" data-domain-section="'+domain.id+'" aria-label="'+domain.name+' trackers"><h3>'+domain.name+'</h3>'+members.map(tracker=>{       const values=metricFor(tracker,state.period,state.records),progress=progressFor(tracker,state.period,state.records);       return '<button class="tracker '+trackerTheme(tracker)+'" data-tracker="'+tracker.id+'"><span class="tracker-title">'+escapeHtml(tracker.name)+'<span class="chevron" aria-hidden="true">›</span></span><span><span class="metric"><strong>'+escapeHtml(values[0])+'</strong><span>'+values[1]+'</span></span><span class="support">'+values[2]+'</span></span><span class="progress-area"><span class="progress-label">'+progress.label+'</span><span class="progress-track" aria-hidden="true"><span class="progress-fill" style="transform:scaleX('+progress.ratio+')"></span></span></span></button>';     }).join('')+'</section>';   }).join(''); }  function showFirst(first){state.first=first;stack.hidden=first;$('.section-heading').hidden=first;$('.create-panel').hidden=!first;dock.hidden=first;$('.domain-nav').hidden=first;$('.calendar-gate').hidden=first;$('.view-toggle').textContent=first?'Back to my trackers':'Try first-time view';} function setPicker(open){$('.create-toggle').setAttribute('aria-expanded',String(open));$('.habit-options').classList.toggle('open',open);$('.habit-options').inert=!open;} function openDialog(title,eyebrow,content,kind,tracker=null){   action=kind;active=tracker;$('.submit').hidden=kind==='select';$('#dialog-title').textContent=title;$('.eyebrow').textContent=eyebrow;$('.dialog-content').innerHTML=content;$('.form-error').textContent='';$('.submit').textContent=kind==='create'?'Create habit':kind==='session'?'Complete session':'Save entry';$('.cancel').textContent='Cancel';dialog.showModal(); } function entry(tracker,kind='entry'){openDialog(kind==='energy'?'Your daily energy':tracker.id==='fitness'?'Log workout':tracker.id==='health'?'Log check-in':'Add expense',tracker.name,entryFields(tracker,kind),kind,tracker);} function completeSession(tracker){openDialog(tracker.name,'Your weekly rhythm','<p>Mark a session complete for '+DEMO_TODAY+'?</p>','session',tracker);} function finishEntry(message){dialog.close();renderHome();pages.refresh();toast(message);if(pages.current())$('.detail-log').focus();else $('.log-toggle').focus();} function createHabit(name){openDialog('Make room for '+name.toLowerCase()+'.','New habit','<label>Habit name<input name="habit" value="'+escapeHtml(name==='More?'?'':name)+'" placeholder="A habit that matters to you" maxlength="60" required></label><label>Domain<select name="trackerDomain">'+domains.filter(domain=>domain.id!=='all').map(domain=>'<option value="'+domain.id+'" '+(domain.id===(state.domain==='all'?'hobbies':state.domain)?'selected':'')+'>'+domain.name+'</option>').join('')+'</select></label><label>Weekly sessions<input name="target" type="number" min="1" max="21" step="1" value="3" required></label>','create');} renderHome(); $('#period-options').innerHTML=periods.map((label,index)=>'<button data-period="'+index+'" aria-pressed="'+(index===0)+'">'+label+'</button>').join(''); $('.habit-list').innerHTML=['Fitness','Expenses','Hobbies','Health','More?'].map(name=>'<button class="habit-choice '+name.toLowerCase()+'" data-habit="'+name+'">'+name+'<span class="chevron" aria-hidden="true">›</span></button>').join(''); $('.period').addEventListener('click',()=>{const open=$('#period-options').hidden;$('#period-options').hidden=!open;$('.period').setAttribute('aria-expanded',String(open));}); $('#period-options').addEventListener('click',event=>{   const button=event.target.closest('[data-period]');if(!button)return;   state.period=Number(button.dataset.period);$('.period').innerHTML=periods[state.period]+' <span aria-hidden="true">⌄</span>';   for(const option of $('#period-options').children)option.setAttribute('aria-pressed',String(option===button));   $('#period-options').hidden=true;$('.period').setAttribute('aria-expanded','false');$('.period').focus();renderHome(); }); const contexts=createContextPage(root,{getTrackers:allTrackers,onSave:record=>{state.notes.push(record);toast('Context saved across your trackers.');}}); const entryMode=initEntryMode(root,{   onBrowse:id=>pages.open(id,state.period),   onSelect:id=>{const tracker=allTrackers().find(item=>item.id===id);tracker.id.startsWith('habit-')?completeSession(tracker):entry(tracker);},   onOther:()=>contexts.open(),   onCreate:()=>{showFirst(true);setPicker(true);$('.create-toggle').focus();} }); $('.dialog-content').addEventListener('change',event=>{   if(event.target.name!=='workoutType')return;const distance=$('.run-distance');const running=event.target.value==='Run';distance.hidden=!running;distance.inert=!running; }); $('.view-toggle').addEventListener('click',()=>{showFirst(!state.first);setPicker(false);}); $('.create-toggle').addEventListener('click',()=>setPicker($('.create-toggle').getAttribute('aria-expanded')!=='true')); $('.habit-list').addEventListener('click',event=>{const button=event.target.closest('[data-habit]');if(button)createHabit(button.dataset.habit);}); $('.close').addEventListener('click',()=>dialog.close());$('.cancel').addEventListener('click',()=>dialog.close()); root.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#period-options').hidden){$('#period-options').hidden=true;$('.period').setAttribute('aria-expanded','false');$('.period').focus();}}); root.addEventListener('click',event=>{if(!event.target.closest('.period-wrap')){$('#period-options').hidden=true;$('.period').setAttribute('aria-expanded','false');}}); form.addEventListener('submit',event=>{   event.preventDefault();const data=new FormData(form);   if(action==='entry'||action==='energy'){     const result=buildEntry(active,action,data);     if(result.error){$('.form-error').textContent=result.error;form.elements[result.field].focus();return;}     recordEntry(state.records,result.record);finishEntry(action==='energy'?'Daily energy recorded':'Entry added');   }else if(action==='create'){     const name=data.get('habit').trim(),target=Number(data.get('target')),domain=data.get('trackerDomain');     if(!name||name.length>60||!Number.isInteger(target)||target<1||target>21||!domains.some(item=>item.id!=='all'&&item.id===domain)){$('.form-error').textContent='Enter a habit name and 1–21 sessions per week.';return;}     state.custom.push({id:'habit-'+(state.custom.length+1),name,target,domain});dialog.close();showFirst(false);renderHome();if(state.domain!=='all'&&state.domain!==domain)navigation.select(domain);toast(name+' created');   }else if(action==='session'){     recordEntry(state.records,{tracker:active.id,kind:'session',date:DEMO_TODAY,description:'Session completed',amount:1});finishEntry('Session completed.');    } }); const navigation=createHomeNavigation(root,{onChange:(domain,jump)=>{   if(jump)entryMode.exit();state.domain=domain;if(jump)root.dispatchEvent(new Event('domainchange')); }}); const calendar=createCalendarPage(root,{   getEvents:()=>state.schedule,getTrackers:allTrackers,getDomain:()=>state.domain,getPeriod:()=>state.period,   onOpen:()=>entryMode.exit(),onClose:()=>calendarGesture.reset(),notify:toast,   onPeriod:period=>{state.period=period;$('.period').innerHTML=periods[period]+' <span aria-hidden="true">⌄</span>';for(const button of $('#period-options').children)button.setAttribute('aria-pressed',String(Number(button.dataset.period)===period));renderHome();},   onSave:record=>{const index=state.schedule.findIndex(event=>event.id===record.id);if(index<0)state.schedule.push(record);else state.schedule[index]=record;updateCalendarPeek();},   onDelete:id=>{state.schedule=state.schedule.filter(event=>event.id!==id);updateCalendarPeek();} }); function updateCalendarPeek() {   const events=state.schedule.filter(event=>event.date===DEMO_TODAY).sort((a,b)=>a.start.localeCompare(b.start));   $('.peek-content p').textContent='19 November · '+events.length+' scheduled events';   $('.peek-events').innerHTML=events.slice(0,2).map(event=>'<span class="'+event.domain+'">'+event.start+' '+escapeHtml(event.title)+'</span>').join(''); } updateCalendarPeek(); const calendarGesture=initCalendarGesture(root,()=>calendar.open()); pages.restore();contexts.restore();calendar.restore(); 
}
